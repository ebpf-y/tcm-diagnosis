name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run test suite（引擎单测 + 医案回测 + API 集成测试）
        run: npm test
        env:
          # API 测试使用独立 SQLite 测试库（beforeAll 自动 db push）
          DATABASE_URL: file:./test.db
          LLM_API_KEY: ""
          VISION_API_KEY: ""

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
